[project]
name = "laya-gateway"
version = "0.1.0"
description = "Internal routing and metering gateway for Laya workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "tokenizers==0.23.2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-anyio>=0.0.0,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laya_gateway = ["laya-tokenizer.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
